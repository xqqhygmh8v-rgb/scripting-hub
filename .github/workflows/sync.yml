# 工作流：同步脚本中心
# 每 6 小时自动运行一次；也可以在 Actions 页面手动触发，
# 手动触发时可勾选「只预览」看结果而不写入仓库。
name: 同步脚本中心

on:
  schedule:
    # 定时任务：UTC 时间每 6 小时的整点运行
    - cron: "0 */6 * * *"
  # 允许手动运行；dry_run 为 true 时只跑逻辑、不落盘、不提交
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只预览结果（不写入文件、不提交）"
        type: boolean
        default: false

# 授予工作流写入仓库内容的权限（用于提交同步结果）
permissions:
  contents: write

# 同一时间只允许一个同步任务运行，避免并发冲突
concurrency:
  group: sync-scripting-hub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 若不想在 CI 里跑用例，删掉这一步即可
      - name: 运行离线用例
        run: python test_sync.py

      - name: 运行同步脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仅手动触发并勾选 dry_run 时才为 1
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python sync.py

      - name: 提交并推送变更
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变更，无需提交。"
            exit 0
          fi
          git commit -m "同步脚本中心 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: 预览模式提示
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "DRY_RUN 已开启：本次没有写入任何文件，也没有提交。"
          echo "完整的预览结果见本页顶部的运行摘要。"
